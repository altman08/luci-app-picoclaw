name: Release OpenWrt packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  openwrt-packages:
    name: OpenWrt ${{ matrix.sdk }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_cortex-a7
          - arm_cortex-a9
        sdk:
          - '25.12.5'

    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git check-ref-format "refs/tags/${TAG}"

      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build OpenWrt packages
        uses: openwrt/gh-action-sdk@v11
        timeout-minutes: 330
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEED_DIR: ${{ github.workspace }}
          NO_SHFMT_CHECK: true
          NO_REFRESH_CHECK: true
          # LuCI builds the zh-cn translation from po/zh_Hans as a subpackage
          # of luci-app-picoclaw; it is not a separate source build target.
          PACKAGES: picoclaw luci-app-picoclaw
          V: sc

      - name: Collect project packages
        env:
          ARCH: ${{ matrix.arch }}
          SDK: ${{ matrix.sdk }}
        run: |
          set -euo pipefail
          package_dir="bin/packages/${ARCH}/action"
          shopt -s nullglob
          backend=("${package_dir}"/picoclaw-[0-9]*.apk)
          frontend=("${package_dir}"/luci-app-picoclaw-[0-9]*.apk)
          translations=("${package_dir}"/luci-i18n-picoclaw-zh-cn-[0-9]*.apk)
          if ((${#backend[@]} != 1 || ${#frontend[@]} != 1 || ${#translations[@]} != 1)); then
            echo "::error::Expected exactly one APK each for picoclaw, luci-app-picoclaw and luci-i18n-picoclaw-zh-cn in ${package_dir}"
            exit 1
          fi
          mkdir -p artifacts/apk
          # Do not publish dependency packages; distinguish universal LuCI
          # packages by SDK and architecture to avoid release name collisions.
          for package in "${backend[@]}" "${frontend[@]}" "${translations[@]}"; do
            filename=$(basename "$package")
            extension="${filename##*.}"
            stem="${filename%.*}"
            cp "$package" "artifacts/apk/${stem}_openwrt-${SDK}_${ARCH}.${extension}"
          done
          (
            cd artifacts/apk
            packages=(*.apk)
            sha256sum "${packages[@]}" > "sha256sums_openwrt-${SDK}_${ARCH}"
          )

      - name: Upload OpenWrt packages
        uses: actions/upload-artifact@v4
        with:
          name: picoclaw-openwrt-${{ matrix.sdk }}-${{ matrix.arch }}
          path: artifacts/apk/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: picoclaw-build-logs-${{ matrix.sdk }}-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish OpenWrt packages
    needs: openwrt-packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download OpenWrt packages
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          pattern: picoclaw-openwrt-*
          path: artifacts/apk
          merge-multiple: true

      - name: Create release and upload packages
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          TARGET: ${{ github.sha }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if timeout --kill-after=5s 90s "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            return 1
          }
          # A failed lookup can also mean a network error. Check again on
          # retries so a completed-but-timed-out creation remains idempotent.
          ensure_release() {
            if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
              return 0
            fi
            local args=(
              "$TAG"
              --repo "$REPOSITORY"
              --target "$TARGET"
              --title "$TAG"
              --generate-notes
            )
            if [ "$PRERELEASE" = true ]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          }
          export -f ensure_release
          retry bash -c ensure_release
          retry gh release upload "$TAG" artifacts/apk/* --repo "$REPOSITORY" --clobber
